name: Release Extension

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Test the tagged release
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.ref_name }}

  publish:
    name: Publish the tested ZIP
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: basicrum-magento-1-release
          path: release
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils unzip
      - name: Recheck the tested archive without rebuilding
        env:
          ARCHIVE_NAME: ${{ needs.checks.outputs.archive_name }}
        run: bash tools/verify-release.sh "release/$ARCHIVE_NAME"
      - name: Create GitHub release and attach assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'legacy' }}
          fail_on_unmatched_files: true
          files: |
            release/${{ needs.checks.outputs.archive_name }}
            release/${{ needs.checks.outputs.archive_name }}.sha256
